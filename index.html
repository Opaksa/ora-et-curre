ton><button id="next">다음</button></nav></section><section id="editor" hidden><h2>전례 편집</h2><p class="muted">이 브라우저에만 저장되는 시험용 편집기입니다.</p><form id="editform"></form><nav><button id="save">저장</button><button class="secondary" id="preview">미리보기</button><button class="secondary" id="archive">보관본</button><button class="secondary" id="exit">닫기</button></nav><div id="archives"></div></section><footer><small>Ora et Curre · 기도하고 달리라</small></footer></main><script>
const initial={title:'러닝기도회',date:'',code:'OEC',before:'침묵\n\n시작응답 [확정 문구 입력]\n\n본기도 [입력]\n\n시편 [입력]\n\n성서독서와 묵상',reading:'',koUrl:'',enUrl:'',during:'하느님의 아들이신 주 예수 그리스도여, 이 죄인을 불쌍히 여기소서.',after:'침묵과 감사\n\n중보기도\n\n주의 기도 [확정 문구 입력]\n\n마침과 파송 [확정 문구 입력]',intentions:''};const $=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem('oec-current')||'null')||initial,step=0;const stages=['출발 전','달리는 동안','도착 후'];function show(id){for(const x of ['home','reader','editor'])$(x).hidden=x!==id;$('event').textContent=[data.date,data.title].filter(Boolean).join(' · ')}function article(text,cls){const a=document.createElement('article');a.textContent=text;if(cls)a.className=cls;$('content').append(a)}function render(){show('reader');$('heading').textContent=stages[step];$('tabs').replaceChildren();stages.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.className=i===step?'':'secondary';b.onclick=()=>{step=i;render()};$('tabs').append(b)});$('content').replaceChildren();article(data[['before','during','after'][step]],step===1?'prayer':'');if(step===0){article(data.reading||'성서 본문 미지정');for(const [key,label] of [['koUrl','새번역'],['enUrl','NRSV']]){try{const u=new URL(data[key]);if(u.protocol!=='https:')continue;const a=document.createElement('a');a.href=u.href;a.textContent=label+' ↗';a.target='_blank';a.rel='noopener noreferrer';$('content').append(a,document.createTextNode('  '))}catch{}}}if(step===2)article(data.intentions||'중보기도 제목 미지정');$('back').textContent=step?'이전':'처음';$('next').textContent=step===2?'마침':'다음'}$('entry').onsubmit=e=>{e.preventDefault();if($('code').value!==data.code){$('error').textContent='접속코드를 확인하세요.';return}step=0;render()};$('back').onclick=()=>{if(step){step--;render()}else show('home')};$('next').onclick=()=>{if(step<2){step++;render()}else show('home')};const fields={title:'모임 제목',date:'날짜',code:'접속코드 (시험용)',before:'출발 전 전례',reading:'성서 본문',koUrl:'새번역 링크',enUrl:'NRSV 링크',during:'예수기도',after:'도착 후 전례',intentions:'중보기도 제목'};function edit(){show('editor');$('editform').replaceChildren();for(const [k,v] of Object.entries(fields)){const l=document.createElement('label');l.textContent=v;const el=document.createElement(['before','during','after','intentions'].includes(k)?'textarea':'input');el.name=k;el.value=data[k]||'';if(k==='date')el.type='date';l.append(el);$('editform').append(l)}}function collect(){return Object.fromEntries(new FormData($('editform')))}$('admin').onclick=edit;$('exit').onclick=()=>show('home');$('save').onclick=()=>{const next=collect();if(!next.code.trim()){alert('접속코드를 입력하세요.');return}const history=JSON.parse(localStorage.getItem('oec-archive')||'[]');history.push(data);localStorage.setItem('oec-archive',JSON.stringify(history));data=next;localStorage.setItem('oec-current',JSON.stringify(data));show('home')};$('preview').onclick=()=>{data=collect();step=0;render()};$('archive').onclick=()=>{const a=$('archives');a.replaceChildren();const history=JSON.parse(localStorage.getItem('oec-archive')||'[]');history.forEach(item=>{const b=document.createElement('button');b.className='secondary';b.textContent=(item.date||'날짜 없음')+' '+item.title;b.onclick=()=>{data=item;edit()};a.append(b)});if(!history.length)a.textContent='보관본 없음'};show('home');</script></body></html>
